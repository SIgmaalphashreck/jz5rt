name: Build SquallowTweaks for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Findet main.py + requirements.txt im Repo-Root oder in einem Unterordner.
      - name: Locate project
        run: |
          Write-Host "=== Dateien im Repository (Tiefe 3) ==="
          Get-ChildItem -Recurse -File -Depth 3 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }
          $skip = '[\\/](\.git|venv|\.venv|build|dist|__pycache__)[\\/]'
          $main = Get-ChildItem -Recurse -File -Filter main.py |
                  Where-Object { $_.FullName -notmatch $skip } |
                  Where-Object { Test-Path (Join-Path $_.DirectoryName 'requirements.txt') } |
                  Select-Object -First 1
          if (-not $main) { throw "Kein Ordner mit main.py UND requirements.txt gefunden (siehe Dateiliste oben)." }
          "PROJECT_DIR=$($main.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m compileall -q main.py app.py pages.py service.py ui_common.py engine.py catalog.py netlab.py fnmon.py
          if ($LASTEXITCODE -ne 0) { throw "Syntaxfehler gefunden." }

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m unittest discover -s tests -v

      - name: Build portable EXE
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name SquallowTweaks --icon assets/icon.ico --add-data "assets;assets" `
            --exclude-module tkinter main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller ist fehlgeschlagen." }
          if (-not (Test-Path "dist/SquallowTweaks.exe")) { throw "dist/SquallowTweaks.exe wurde nicht erstellt." }
          Get-Item dist/SquallowTweaks.exe | Format-List Name, Length

      # Startet die gebaute EXE unsichtbar, baut das Fenster und rendert jede Seite.
      - name: Self-test built EXE
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          $p = Start-Process -FilePath "dist/SquallowTweaks.exe" -ArgumentList "--selftest" -Wait -PassThru
          $report = Join-Path $env:LOCALAPPDATA "SquallowTweaks/selftest.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "EXE-Selbsttest fehlgeschlagen (Exitcode $($p.ExitCode))." }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SquallowTweaks-Windows-EXE
          path: ${{ env.PROJECT_DIR }}/dist/SquallowTweaks.exe
          if-no-files-found: error
          retention-days: 14
